id: secret_dotfiles
name: 숨김·백업 파일 열람
enabled: true
source: http
event_type: request
severity: high
auto_respond: true
match:
  path_prefixes:
    - /.git
    - /.svn
    - /.env
    - /.aws
    - /backup
    - /dump.sql
    - /config.php
    - /web.config
    - /swagger
    - /api-docs
    - /graphql
  missing_auth: true
actions:
  - alert
  - deny_request
description: 인증 없이 저장소·설정·백업·문서 경로를 열면 거부합니다.
