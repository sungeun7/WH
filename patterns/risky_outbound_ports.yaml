id: risky_outbound_ports
name: 고위험 외부 포트 연결
enabled: true
source: windows
event_type: net_connect
severity: medium
auto_respond: false
match:
  dest_ports:
    - 22
    - 23
    - 445
    - 3389
    - 5900
  ignore_private: false
actions:
  - alert
description: SSH·RDP·SMB 등 원격 관리 포트로 나가는 연결을 경보합니다. 방화벽 변경은 승인 후입니다.
