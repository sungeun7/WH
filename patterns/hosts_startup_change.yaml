id: hosts_startup_change
name: hosts·시작프로그램 변경
enabled: true
source: windows
event_type: file_change
severity: high
auto_respond: false
match:
  path_contains:
    - "\\drivers\\etc\\hosts"
    - "\\Start Menu\\Programs\\Startup"
    - "\\Microsoft\\Windows\\Start Menu\\Programs\\Startup"
actions:
  - alert
description: 이름 해석이나 시작프로그램 폴더 변경을 경보합니다. 종료·삭제는 하지 않습니다.
