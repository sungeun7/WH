id: scanner_user_agent
name: 스캐너 User-Agent
enabled: true
source: http
event_type: request
severity: medium
auto_respond: true
match:
  ua_contains:
    - sqlmap
    - nikto
    - nmap
    - masscan
    - gobuster
    - dirbuster
    - nuclei
    - zgrab
    - wpscan
    - fuzz
actions:
  - alert
  - deny_ip
description: 잘 알려진 스캐너 User-Agent면 IP를 잠시 막습니다. 본인 자산 방어 전용입니다.
